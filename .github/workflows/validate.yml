name: Validate Quantum Breaks AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate single-file app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          html = Path("index.html").read_text(encoding="utf-8")

          required = [
              'id="prompt"',
              'id="send"',
              'id="modelsModal"',
              'id="projectsModal"',
              'id="compareModal"',
              'id="usageModal"',
              'id="imageModal"',
              'id="videoModal"',
              'id="voiceModal"',
              'id="artifactModal"',
              'id="trashModal"',
              'id="scratchpadModal"',
              'id="globalSearchModal"',
              'id="profilesModal"',
              'id="commandModal"',
              'id="diagnosticsModal"',
              'id="modeBtn"',
              'id="printSide"',
              'id="exportEncryptedWorkspace"',
              'id="webToggle"',
              'id="agentToggle"',
              'id="advisorToggle"',
              'id="fusionToggle"',
              'id="tempToggle"',
              'id="responseFormat"',
              'id="maxTokens"',
              'id="micBtn"',
              'id="modelSort"',
              'id="checkUpdateSide"',
              'id="selMemory"',
              'id="projectModel"',
              'id="slashMenu"',
              'id="contextPreviewModal"',
              'id="galleryModal"',
              'id="filePreviewModal"',
              'id="improvePromptBtn"',
              'id="composerMetrics"',
              'id="jsonSchemaText"',
              'id="reviewToggle"',
              'id="outlineModal"',
              'id="snapshotsModal"',
              'id="analyticsModal"',
              'MEDIA_DB="quantum_breaks_media_v1"',
              'id="lightbox"',
              'id="archiveModal"',
              'id="storageModal"',
              'https://openrouter.ai/api/v1',
              'openrouter:web_search',
              'openrouter:web_fetch',
              'openrouter:subagent',
              'openrouter:advisor',
              'openrouter:fusion',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing required app markers: " + ", ".join(missing))

          # Catch accidental secret commits anywhere in the repository, not just index.html.
          secret_re = re.compile(r"sk-or-v1-[A-Za-z0-9_-]{20,}")
          for candidate in Path(".").rglob("*"):
              if not candidate.is_file() or ".git" in candidate.parts:
                  continue
              if candidate.suffix.lower() not in {".html", ".js", ".md", ".json", ".yml", ".yaml", ".txt"}:
                  continue
              try:
                  text = candidate.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              if secret_re.search(text):
                  raise SystemExit(f"A likely OpenRouter API key was found in {candidate}")

          for path in ["manifest.webmanifest", "sw.js", "icon.svg"]:
              if not Path(path).exists():
                  raise SystemExit(f"Missing required PWA file: {path}")

          manifest = json.loads(Path("manifest.webmanifest").read_text(encoding="utf-8"))
          if manifest.get("name") != "Quantum Breaks AI":
              raise SystemExit("PWA manifest name is not Quantum Breaks AI")

          # Validate DOM id integrity and the selectors used by the single-file app.
          ids = re.findall(r'\\bid="([^"]+)"', html)
          duplicates = sorted({item for item in ids if ids.count(item) > 1})
          if duplicates:
              raise SystemExit("Duplicate HTML ids: " + ", ".join(duplicates))

          start = html.index("<script>") + len("<script>")
          end = html.index("</script>", start)
          script = html[start:end]
          selector_ids = sorted(set(re.findall(r'q\\("#([A-Za-z0-9_-]+)"\\)', script)))
          missing_selector_ids = [item for item in selector_ids if item not in set(ids)]
          if missing_selector_ids:
              raise SystemExit("JavaScript references missing HTML ids: " + ", ".join(missing_selector_ids))

          version_match = re.search(r'APP_VERSION="([^"]+)"', script)
          if not version_match:
              raise SystemExit("APP_VERSION is missing")
          readme = Path("README.md").read_text(encoding="utf-8")
          release_match = re.search(r"Current app generation: v([0-9.]+)", readme)
          if not release_match or release_match.group(1) != version_match.group(1):
              raise SystemExit("README release version does not match APP_VERSION")

          Path("/tmp/quantum-breaks-app.js").write_text(script, encoding="utf-8")

          print("HTML ids, selectors, manifest, versions, PWA files, and secret checks passed")
          PY

      - name: Check app JavaScript syntax
        run: node --check /tmp/quantum-breaks-app.js

      - name: Check service worker syntax
        run: node --check sw.js
