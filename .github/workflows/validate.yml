name: Validate NoLimit AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          start = html.index("<script>") + len("<script>")
          end = html.index("</script>", start)
          Path("/tmp/nolimit-app.js").write_text(html[start:end], encoding="utf-8")
          required = [
              'id="prompt"',
              'id="send"',
              'id="modelsModal"',
              'id="imageModal"',
              'id="webToggle"',
              'id="micBtn"',
              'https://openrouter.ai/api/v1',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit("Missing required app markers: " + ", ".join(missing))
          print("HTML checks passed")
          PY

      - name: Check JavaScript syntax
        run: node --check /tmp/nolimit-app.js
